version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /.ci/test-tools
    # Pinned compatibility tools: automatic security fixes only.
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /.ci/build-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /modules
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /packages/otorp
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /community/framework-fixtures/angular
    # Angular 22.2.x requires TypeScript >=6.0 <6.1.
    ignore:
      - dependency-name: typescript
        versions: [">=6.1"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
