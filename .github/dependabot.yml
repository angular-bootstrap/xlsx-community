version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /.ci/test-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /.ci/build-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /modules
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /packages/otorp
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /community/framework-fixtures/angular
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
